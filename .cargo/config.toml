# 本机联调配置由编辑器自己读取；独立发布的源码检出可使用自己的公开补丁配置。
include = [{ path = "local-sdk.toml", optional = true }]

# 在feathrise/直接cargo run启动Feathrise，使用本工作区默认的target/输出目录。
# editor_prototype/验证原型及其已有缓存保持独立，不再把正式编辑器产物写进validation/。

[target.x86_64-pc-windows-msvc]
linker = "rust-lld"

[alias]
# 基础发行关闭 Bevy 开发动态链接。静态 CRT 只传给发行目标的依赖。
build-windows-release = [
    "build", "--locked", "--release", "--target", "x86_64-pc-windows-msvc",
    "--no-default-features", "--features", "raytracing",
    "--config", "target.x86_64-pc-windows-msvc.rustflags=['-Ctarget-feature=+crt-static']",
]

# 内嵌目录显式绑定源码 assets，使用现有或自定义 target 缓存时结果一致。
[env]
BEVY_ASSET_PATH = { value = "assets", relative = true }
# 来源根由当前检出绑定，独立于允许显式覆盖的资源目录；用于跨工作树缓存失效。
FEATHRISE_BUILD_SOURCE_ROOT = { value = ".", relative = true, force = true }
