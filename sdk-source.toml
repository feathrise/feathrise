# 新建工程的 SDK 与八项 Cargo 补丁只在这里选择来源。
# 路径相对本文件所在的编辑器资源根，不随启动工作目录改变。
format = 1

[source]
kind = "path"
path = "../feathrise_runtime"
patch_path = "../feathrise_patches"

# 使用固定公开 Git 来源时，用下面同一组字段替换上面的 source 表内容：
# kind = "git"
# git = "https://github.com/hwyrq/feathrise_runtime.git"
# rev = "a476d2374cdc0383efe25129e0003c8fd2733f01"
# patch_git = "https://github.com/hwyrq/feathrise_patches.git"
# patch_rev = "3c251d3530980b66e49b4748769db36ae9c6bd5a"
# 不接受分支、标签或短 rev。改配置只影响之后创建的工程，不改写已有工程。

# 共享库发布到 crates.io 后，也可选择 registry；本地开发仍保留上面的 path。
# kind = "registry"
# version = "0.1.0" # 必须是完整发布版本，生成工程时固定到该版本。
# git = "实际公开补丁仓 URL" # SDK 版本由 crates.io 提供。
# rev = "与该版本配套的完整 40 位 Git 提交 ID"
