[package]
name = "feathrise_game_template"
version = "0.1.0"
edition = "2024"
publish = false
default-run = "project"

[[bin]]
name = "project"
path = "src/main.rs"

[features]
default = ["raytracing"]
raytracing = ["feathrise_runtime/raytracing"]
dlss = ["dlss_frame_generation"]
fsr = ["fsr3_upscaling", "fsr3_frame_generation"]
rtx_rendering = ["raytracing", "feathrise_runtime/rtx_rendering"]
dlss_frame_generation = ["rtx_rendering", "feathrise_runtime/dlss_frame_generation"]
fsr3_upscaling = ["feathrise_runtime/fsr3_upscaling"]
fsr3_frame_generation = ["feathrise_runtime/fsr3_frame_generation"]
physics_debug = ["feathrise_runtime/physics_debug"]
initial_items = [] # 空模板不因调试特性添加领域专属的初始物品。

validation = ["feathrise_runtime/validation"]
function_hotpatch = ["bevy/hotpatching", "feathrise_runtime/function_hotpatch"]

# 只登记无状态的数值函数；其他源码改动仍由完整构建与重启承接。
[package.metadata.feathrise.hotpatch]
enabled = true
functions = ["src/controller.rs::walk_speed", "src/controller.rs::run_speed"]

[dependencies]
bevy = { version = "=0.20.1", default-features = false, features = ["dynamic_linking", "free_camera"] } # 工程应用显式选择开发动态链接，SDK库不替应用决定。
feathrise_runtime = { git = "https://github.com/feathrise/feathrise_runtime.git", rev = "92805cf32f07652eb435206601f3f5237770a018", default-features = false, features = ["default_font"] }

[workspace]
resolver = "3"

# 模板与生成后的独立工程使用同一套 Bevy 补丁和锁。
[patch.crates-io]
avian3d = { git = "https://github.com/feathrise/feathrise_patches.git", rev = "5eaec9241a2c1860f8b2f683a80fbe2b150236e8" }
bevy_anti_alias = { git = "https://github.com/feathrise/feathrise_patches.git", rev = "5eaec9241a2c1860f8b2f683a80fbe2b150236e8" }
bevy_render = { git = "https://github.com/feathrise/feathrise_patches.git", rev = "5eaec9241a2c1860f8b2f683a80fbe2b150236e8" }
bevy_core_pipeline = { git = "https://github.com/feathrise/feathrise_patches.git", rev = "5eaec9241a2c1860f8b2f683a80fbe2b150236e8" }
bevy_extract = { git = "https://github.com/feathrise/feathrise_patches.git", rev = "5eaec9241a2c1860f8b2f683a80fbe2b150236e8" }
wgpu-hal = { git = "https://github.com/feathrise/feathrise_patches.git", rev = "5eaec9241a2c1860f8b2f683a80fbe2b150236e8" }
dlss_wgpu = { git = "https://github.com/feathrise/feathrise_patches.git", rev = "5eaec9241a2c1860f8b2f683a80fbe2b150236e8" }
wgpu-ffx = { git = "https://github.com/feathrise/feathrise_patches.git", rev = "5eaec9241a2c1860f8b2f683a80fbe2b150236e8" }

# 新工程低优化便于迭代，外部依赖使用高优化。
[profile.dev]
opt-level = 0
debug = "line-tables-only"
strip = false

[profile.dev.package."*"]
opt-level = 3

[profile.render-dev]
inherits = "dev"
