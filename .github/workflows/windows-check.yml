# 源码联调和发行构建分别核对本地检出与 crates.io SDK。
name: Windows editor check

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: editor-check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.source == 'registry' && format('check (registry, {0})', matrix.variant) || format('check ({0})', matrix.variant) }}
    runs-on: windows-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        source: [source, registry]
        variant: [default, validation]
    env:
      # 默认采用已验证的 Bevy 0.20.1 配套源码。仓库变量可覆盖为另一组完整提交。
      FEATHRISE_SDK_REPOSITORY: ${{ vars.FEATHRISE_SDK_REPOSITORY || 'feathrise/feathrise_runtime' }}
      FEATHRISE_SDK_REV: ${{ vars.FEATHRISE_SDK_REV || '7f6679f1d3b1b35e82cac35583431d20fa132f9e' }}
      FEATHRISE_PATCH_REPOSITORY: ${{ vars.FEATHRISE_PATCH_REPOSITORY || 'feathrise/feathrise_patches' }}
      FEATHRISE_PATCH_REV: ${{ vars.FEATHRISE_PATCH_REV || '019fd1fe13ed9107d17b360b8f5a3df61bfc139a' }}
    steps:
      - name: Require the public patch repository and full revision
        if: matrix.source == 'source'
        shell: pwsh
        run: |
          if ($env:FEATHRISE_PATCH_REPOSITORY -notmatch '^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$' -or $env:FEATHRISE_PATCH_REV -notmatch '^[0-9a-fA-F]{40}$') {
            throw '请配置 FEATHRISE_PATCH_REPOSITORY=owner/repository 和 FEATHRISE_PATCH_REV=已发布到补丁仓的 Bevy 0.20.1 完整 40 位提交。'
          }
      - name: Require the public SDK repository and full revision
        if: matrix.source == 'source'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:FEATHRISE_SDK_REPOSITORY -notmatch '^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$') {
            throw 'FEATHRISE_SDK_REPOSITORY 必须为 owner/repository；请修正仓库变量，或移除覆盖以使用公开默认值。'
          }
          if ($env:FEATHRISE_SDK_REV -notmatch '^[0-9a-fA-F]{40}$') {
            throw '请配置 FEATHRISE_SDK_REV 为已发布到 SDK 仓库的 Bevy 0.20.1 完整 40 位提交。'
          }
      # actions/checkout v4.2.2；各检出均不持久化凭据。
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: feathrise
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        if: matrix.source == 'source'
        with:
          repository: ${{ env.FEATHRISE_SDK_REPOSITORY }}
          ref: ${{ env.FEATHRISE_SDK_REV }}
          path: feathrise_runtime
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        if: matrix.source == 'source'
        with:
          repository: ${{ env.FEATHRISE_PATCH_REPOSITORY }}
          ref: ${{ env.FEATHRISE_PATCH_REV }}
          path: feathrise_patches
          persist-credentials: false
      - name: Confirm the SDK checkout identity
        if: matrix.source == 'source'
        shell: pwsh
        working-directory: feathrise_runtime
        run: |
          $actual = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $actual -ne $env:FEATHRISE_SDK_REV) { throw 'SDK 检出身份与指定修订不一致。' }
      - name: Identify the Cargo cache and existing Rust toolchain
        id: cargo-cache
        shell: pwsh
        working-directory: feathrise
        run: |
          $ErrorActionPreference = 'Stop'
          $cargoHome = if ($env:CARGO_HOME) { $env:CARGO_HOME } else { Join-Path $env:USERPROFILE '.cargo' }
          "cargo-home=$cargoHome" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          $rustcIdentity = rustc --version --verbose
          if ($LASTEXITCODE -ne 0) { throw '无法读取现有 Rust 工具链的缓存身份。' }
          # 编译缓存绑定两份检出身份与真实工具链。
          $sourceIdentity = if ('${{ matrix.source }}' -eq 'registry') {
            (Get-FileHash -LiteralPath '.cargo/registry-sdk.toml' -Algorithm SHA256).Hash
          } else {
            @($env:FEATHRISE_SDK_REPOSITORY, $env:FEATHRISE_SDK_REV, $env:FEATHRISE_PATCH_REPOSITORY, $env:FEATHRISE_PATCH_REV)
          }
          $identity = (@($rustcIdentity) + @($sourceIdentity)) -join "`n"
          $sha256 = [System.Security.Cryptography.SHA256]::Create()
          try {
            $digest = $sha256.ComputeHash([System.Text.Encoding]::UTF8.GetBytes($identity))
            $buildIdentity = [System.BitConverter]::ToString($digest).Replace('-', '').ToLowerInvariant()
          } finally {
            $sha256.Dispose()
          }
          "build-identity=$buildIdentity" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
      # actions/cache v4.3.0；两个组合共用下载缓存。
      - name: Restore Cargo dependency downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ${{ steps.cargo-cache.outputs.cargo-home }}/registry/index
            ${{ steps.cargo-cache.outputs.cargo-home }}/registry/cache
            ${{ steps.cargo-cache.outputs.cargo-home }}/git/db
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-downloads-v1-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-cargo-downloads-v1-
      # 每个组合保留自己的编译产物；锁或清单变化可先恢复相同工具链/源码组合的依赖，再由 Cargo 判定重编译。
      - name: Restore editor dependency build artifacts
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: feathrise/target
          key: ${{ runner.os }}-${{ runner.arch }}-editor-check-v2-${{ matrix.source }}-${{ matrix.variant }}-${{ steps.cargo-cache.outputs.build-identity }}-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml', '**/.cargo/config.toml', 'feathrise/.github/workflows/windows-check.yml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-editor-check-v2-${{ matrix.source }}-${{ matrix.variant }}-${{ steps.cargo-cache.outputs.build-identity }}-
      - name: Check editor with existing Windows Rust and MSVC
        shell: pwsh
        working-directory: feathrise
        env:
          CHECK_VARIANT: ${{ matrix.variant }}
          CHECK_SOURCE: ${{ matrix.source }}
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          if (!(Test-Path -LiteralPath $vswhere)) { throw 'Runner 缺少 Visual Studio Installer/vswhere。' }
          $installation = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (!$installation) { throw 'Runner 缺少 MSVC x64/x86 工具。' }
          Import-Module (Join-Path $installation 'Common7/Tools/Microsoft.VisualStudio.DevShell.dll')
          Enter-VsDevShell -VsInstallPath $installation -SkipAutomaticLocation -DevCmdArguments '-arch=x64 -host_arch=x64'
          rustup show active-toolchain
          if ($LASTEXITCODE -ne 0) { throw 'Runner 没有可用的 Rust 工具链。' }
          rustc --version --verbose
          if ($LASTEXITCODE -ne 0) { throw 'rustc 无法启动。' }
          $sysroot = rustc --print sysroot
          if ($LASTEXITCODE -ne 0) { throw '无法定位现有 Rust 工具链。' }
          $linkerDirectory = Join-Path $sysroot 'lib/rustlib/x86_64-pc-windows-msvc/bin'
          if (!(Test-Path -LiteralPath (Join-Path $linkerDirectory 'rust-lld.exe'))) { throw '当前工具链缺少 rust-lld.exe。' }
          $env:PATH = "$linkerDirectory;$env:PATH"
          if ($env:CHECK_SOURCE -eq 'registry') {
            # 发行检查使用 Runner 上的公开依赖锁，与单文件构建的解析路径一致。
            $sourceArguments = @('--config', '.cargo/registry-sdk.toml')
            cargo @sourceArguments fetch
            if ($LASTEXITCODE -ne 0) { throw 'Failed to fetch the released SDK and pinned patches.' }
          } else {
            # SDK 自有包与第三方补丁分别采用已核对修订的检出。
            $localSdkConfig = Join-Path $env:RUNNER_TEMP 'feathrise-local-sdk.toml'
            $sdkRoot = (Resolve-Path -LiteralPath '../feathrise_runtime').Path
            $patchRoot = (Resolve-Path -LiteralPath '../feathrise_patches').Path
            $patchRevision = git -C $patchRoot rev-parse HEAD
            if ($LASTEXITCODE -ne 0 -or $patchRevision -ne $env:FEATHRISE_PATCH_REV) { throw '补丁仓检出身份与指定修订不一致。' }
            $patchConfig = Join-Path $patchRoot '.cargo/config.toml'
            $metadata = cargo metadata --manifest-path "$sdkRoot/Cargo.toml" --no-deps --format-version 1
            if ($LASTEXITCODE -ne 0) { throw '无法读取指定修订的 SDK Cargo 图。' }
            $localPackages = ($metadata | ConvertFrom-Json).packages | Where-Object {
              $null -eq $_.source -and $_.name -ne 'feathrise_sdk_workspace_tests'
            }
            $patches = foreach ($package in $localPackages) {
              $packageRoot = Split-Path -Parent $package.manifest_path
              $relativePath = [IO.Path]::GetRelativePath($sdkRoot, $packageRoot)
              if ([IO.Path]::IsPathRooted($relativePath) -or $relativePath -match '^\.\.([\\/]|$)') { throw 'SDK 本地依赖越出指定检出目录。' }
              $path = $packageRoot.Replace('\', '/') | ConvertTo-Json -Compress
              "$($package.name) = { path = $path }"
            }
            @('[patch.crates-io]') + $patches | Set-Content -LiteralPath $localSdkConfig -Encoding utf8
            $sourceArguments = @('--config', $patchConfig, '--config', $localSdkConfig)
          }
          $cargoArguments = $sourceArguments + @('check', '--locked', '-p', 'feathrise_host', '-p', 'feathrise_game_template', '-p', 'feathrise_editor_map', '--tests')
          if ($env:CHECK_VARIANT -eq 'validation') { $cargoArguments += @('--features', 'feathrise_host/validation') }
          elseif ($env:CHECK_VARIANT -ne 'default') { throw '未知检查组合。' }
          cargo @cargoArguments
          if ($LASTEXITCODE -ne 0) { throw "Cargo 检查失败，退出码 $LASTEXITCODE。" }
