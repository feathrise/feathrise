# GLB 绑骨、权重计算和受检文件处理。
[package]
name = "feathrise_editor_glb"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[dependencies]
bevy = { workspace = true }
feathrise_editor_assets = { workspace = true }
feathrise_editor_core = { workspace = true }
feathrise_editor_glb_model = { workspace = true }
gltf = { version = "1.4.1", default-features = false, features = ["utils", "names"] }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Storage_FileSystem"] } # Windows 上无覆盖发布完整候选。
