[package]
name = "feathrise_project"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[features]
# 示例地形只服务显式验收；正常新建工程不链接样例生成器。
validation = ["dep:feathrise_map_terrain"]

[dependencies]
feathrise_map_content = { version = "0.2.0" }
feathrise_map_terrain = { version = "0.2.0", optional = true }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.11.0"

[dev-dependencies]
feathrise_map_terrain = { version = "0.2.0" }
